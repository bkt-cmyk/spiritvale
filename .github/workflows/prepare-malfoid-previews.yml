name: Prepare malfoid previews

on:
  push:
    branches:
      - sticker/malfoid-original-v01

permissions:
  contents: write

jobs:
  previews:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build preview images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          src = Path("project/malfoid")
          out = Path(".tmp-malfoid-preview")
          out.mkdir(parents=True, exist_ok=True)
          manifest = {}
          for i in range(1, 41):
              name = f"{i:02d}.png"
              p = src / name
              im = Image.open(p).convert("RGBA")
              manifest[name] = {"size": list(im.size), "mode": im.mode}
              bg = Image.new("RGB", im.size, "white")
              bg.paste(im, mask=im.getchannel("A"))
              bg.thumbnail((768, 768), Image.Resampling.LANCZOS)
              bg.save(out / f"{i:02d}.jpg", "JPEG", quality=84, optimize=True)
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY
      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-malfoid-preview
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: prepare malfoid preview assets"
          git push
